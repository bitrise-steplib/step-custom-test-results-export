format_version: "10"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ""
workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  test:
    before_run:
    - check
    steps:
    - change-workdir:
        title: Switch working dir to test / _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file' in the step's code, which would
          work for testing the step from this directory directly
          but would break if the step is included in another `bitrise.yml`.
        run_if: "true"
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - script:
        title: Clone sample artifacts repository
        run_if: "true"
        inputs:
        - content: |-
            rm -Rf ./*
            git clone --branch master --depth 1 https://github.com/bitrise-io/sample-artifacts.git
    - path::./:
        title: Step Test
        run_if: "true"
        inputs:
        - test_name: test name
        - base_path: ./
        - search_pattern: "*/xcresult3_multi_level_UI_tests.xcresult"
    - script:
        title: Check if export succeeded
        inputs:
        - content: |-
            FIND_TEST_INFO="$(find $BITRISE_TEST_DEPLOY_DIR -name 'test-info.json' -print -quit)"
            FIND_XCRESULT="$(find $BITRISE_TEST_DEPLOY_DIR -name 'xcresult3_multi_level_UI_tests.xcresult' -print -quit)"
            if [ -n "$FIND_TEST_INFO" ] && [ -n "$FIND_XCRESULT" ]
            then
              echo "Found exported test results at:"
              echo "- $FIND_TEST_INFO"
              echo "- $FIND_XCRESULT"
              exit 0
            else
              echo "Exported test results not found!"
              exit 1
            fi
    - script:
        title: Create a JUnit XML and an attachment named by convention
        inputs:
        - content: |-
            mkdir -p ./convention/results ./convention/build/shots
            cat > ./convention/results/junit.xml <<'EOF'
            <testsuites>
              <testsuite name="LoginTest">
                <testcase classname="com.example.LoginTest" name="emptyState"/>
              </testsuite>
            </testsuites>
            EOF
            echo "screenshot" > ./convention/build/shots/com.example.LoginTest__emptyState__1.png
    - path::./:
        title: Step Test with an attachment named by convention
        inputs:
        - test_name: convention
        - base_path: ./convention
        - search_pattern: "*/junit.xml"
    - script:
        title: Check if the attachment was exported next to the test result
        inputs:
        - content: |-
            FIND_ATTACHMENT="$(find $BITRISE_TEST_DEPLOY_DIR -path '*/convention/com.example.LoginTest__emptyState__1.png' -print -quit)"
            if [ -n "$FIND_ATTACHMENT" ]
            then
              echo "Found exported attachment at: $FIND_ATTACHMENT"
              exit 0
            else
              echo "Exported attachment not found!"
              exit 1
            fi
    - script:
        title: Create one JUnit XML per test class and an attachment for each, as Gradle and Roborazzi do
        inputs:
        - content: |-
            results=./gradle/app/build/test-results/testDebugUnitTest
            mkdir -p $results/binary ./gradle/app/build/outputs/roborazzi
            for class in LoginTest HomeTest; do
              cat > $results/TEST-com.example.$class.xml <<EOF
            <testsuite name="com.example.$class">
              <testcase classname="com.example.$class" name="renders"/>
            </testsuite>
            EOF
              echo "screenshot" > ./gradle/app/build/outputs/roborazzi/com.example.${class}__renders__1.png
            done
            echo "binary" > $results/binary/output.bin
    - path::./:
        title: Step Test exporting every JUnit XML match
        inputs:
        - test_name: gradle
        - base_path: ./gradle/app/build
        - search_pattern: "*/test-results/testDebugUnitTest/TEST-*.xml"
        - export_all_matches: "yes"
    - script:
        title: Check if every test result and attachment was exported into the same report
        inputs:
        - content: |-
            report="$(find $BITRISE_TEST_DEPLOY_DIR -type d -name gradle -print -quit)"
            for file in TEST-com.example.LoginTest.xml TEST-com.example.HomeTest.xml com.example.LoginTest__renders__1.png com.example.HomeTest__renders__1.png; do
              if [ ! -f "$report/$file" ]; then
                echo "$file was not exported into $report!"
                exit 1
              fi
            done
            echo "Found every test result and attachment in $report"

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
        inputs:
        - contrib_section: docs/contribution.md
        - example_section: docs/examples.md
